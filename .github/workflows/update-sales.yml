name: Update sale & news data

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: update-sales
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect sale data
        run: |
          python scripts/fetch_sales.py || echo "sale collection failed"
          python scripts/fetch_news.py
      - name: Commit if changed
        run: |
          git config user.name "shopiq-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update sale data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
